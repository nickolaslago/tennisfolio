name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write
  # Required for cosign keyless signing (Sigstore via the GitHub OIDC provider).
  id-token: write

env:
  GHCR_IMAGE_PREFIX: ghcr.io/nickolaslago/tennisfolio
  DOCKERHUB_IMAGE_PREFIX: docker.io/nickolaslago/tennisfolio

jobs:
  build-and-push:
    name: build + push (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api
            context: ./apps/api
            dockerfile: ./apps/api/Dockerfile
          - name: web
            context: .
            dockerfile: ./apps/web/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub is an opt-in mirror: without DOCKERHUB_USERNAME /
      # DOCKERHUB_TOKEN the release still publishes (and signs) GHCR only.
      - name: Resolve target registries
        id: registries
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          images="${GHCR_IMAGE_PREFIX}-${{ matrix.name }}"
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "dockerhub=true" >> "$GITHUB_OUTPUT"
            images="$(printf '%s\n%s' "$images" "${DOCKERHUB_IMAGE_PREFIX}-${{ matrix.name }}")"
          else
            echo "dockerhub=false" >> "$GITHUB_OUTPUT"
            echo "::warning::DOCKERHUB_USERNAME / DOCKERHUB_TOKEN are not set — publishing to GHCR only, skipping the Docker Hub mirror."
          fi
          {
            echo "images<<EOF"
            echo "$images"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        if: steps.registries.outputs.dockerhub == 'true'
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.registries.outputs.images }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      # provenance/sbom attach a SLSA build provenance attestation and an SPDX
      # SBOM to every published manifest, on each registry the tags point at.
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      # Scans the pushed digest — what actually ships — rather than a local
      # layer, and runs before signing so a failed gate leaves the image
      # unsigned. Unfixed CVEs are reported but don't fail the gate; accepted
      # exceptions go in .trivyignore.
      - name: Scan the published image (Trivy)
        uses: aquasecurity/trivy-action@master
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ env.GHCR_IMAGE_PREFIX }}-${{ matrix.name }}@${{ steps.build.outputs.digest }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1"

      - name: Sign the published digests (cosign keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGES: ${{ steps.registries.outputs.images }}
        run: |
          for image in $IMAGES; do
            echo "Signing ${image}@${DIGEST}"
            cosign sign --yes "${image}@${DIGEST}"
          done
